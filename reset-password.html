<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - 聊天室</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
            <rect width="60" height="60" rx="15" fill="url(#gradient)"/>
            <path d="M30 20C25.5817 20 22 23.5817 22 28V32H20C18.8954 32 18 32.8954 18 34V42C18 43.1046 18.8954 44 20 44H40C41.1046 44 42 43.1046 42 42V34C42 32.8954 41.1046 32 40 32H38V28C38 23.5817 34.4183 20 30 20ZM35 32V28C35 25.2386 32.7614 23 30 23C27.2386 23 25 25.2386 25 28V32H35Z" fill="white"/>
            <defs>
              <linearGradient id="gradient" x1="0" y1="0" x2="60" y2="60">
                <stop offset="0%" stop-color="#34C759"/>
                <stop offset="100%" stop-color="#30D158"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="auth-title">设置新密码</h1>
        <p class="auth-subtitle">请输入您的新密码</p>
        
        <form id="reset-password-form" class="auth-form">
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="new-password" placeholder="至少6位字符" required>
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="confirm-password" placeholder="再次输入新密码" required>
          </div>
          <button type="submit" class="btn-primary">重置密码</button>
        </form>

        <div class="auth-switch">
          <a href="/">返回登录</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 从 URL 获取 token
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alert('无效的重置链接');
      window.location.href = '/';
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        alert('密码至少需要6位字符');
        return;
      }

      if (newPassword !== confirmPassword) {
        alert('两次输入的密码不一致');
        return;
      }

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token: token,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('密码重置成功!请使用新密码登录');
          window.location.href = '/';
        } else {
          alert(data.error || '重置失败');
        }
      } catch (error) {
        console.error('重置密码错误:', error);
        alert('网络错误,请稍后重试');
      }
    });
  </script>
</body>
</html>
