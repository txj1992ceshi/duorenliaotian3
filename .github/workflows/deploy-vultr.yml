name: Deploy to Vultr

on:
  push:
    branches:
      - codex/prod-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          PORT="${{ secrets.VULTR_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.VULTR_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          PORT="${{ secrets.VULTR_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -p $PORT" \
            ./ \
            ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }}:${{ secrets.VULTR_APP_DIR }}/

      - name: Restart pm2
        run: |
          PORT="${{ secrets.VULTR_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh -p "$PORT" ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} "cd ${{ secrets.VULTR_APP_DIR }} && pm2 restart duorenliaotian3 --update-env"
