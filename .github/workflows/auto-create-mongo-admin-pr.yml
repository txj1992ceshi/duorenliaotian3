name: Create MongoDB + Admin PR
on:
  workflow_dispatch: {}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create/update backend files (MongoDB, models, middleware, server)
        run: |
          set -e

          # create models and middleware directories
          mkdir -p models middleware

          # package.json
          cat > package.json <<'EOF'
{
  "name": "chat-room",
  "version": "1.0.0",
  "description": "现代化网页聊天室应用",
  "main": "server.js",
  "scripts": {
    "start": "node server.js",
    "dev": "nodemon server.js"
  },
  "keywords": [
    "chat",
    "socket.io",
    "real-time",
    "messaging"
  ],
  "author": "",
  "license": "MIT",
  "dependencies": {
    "express": "^4.18.2",
    "socket.io": "^4.6.1",
    "cors": "^2.8.5",
    "bcryptjs": "^2.4.3",
    "jsonwebtoken": "^9.0.2",
    "multer": "^1.4.5-lts.1",
    "mongoose": "^8.11.0",
    "dotenv": "^16.0.0"
  },
  "devDependencies": {
    "nodemon": "^3.0.1"
  }
}
EOF

          # models/User.js
          cat > models/User.js <<'EOF'
const mongoose = require('mongoose');

const userSchema = new mongoose.Schema({
  username: { type: String, required: true, unique: true, index: true },
  email: { type: String, required: true, unique: true, index: true },
  password: { type: String, required: true },
  avatar: { type: String },
  role: { type: String, enum: ['user','admin'], default: 'user' },
  groups: [{ type: String }], // groupId 使用字符串以兼容前端
  createdAt: { type: Date, default: Date.now }
});

module.exports = mongoose.model('User', userSchema);
EOF

          # models/Group.js
          cat > models/Group.js <<'EOF'
const mongoose = require('mongoose');

const groupSchema = new mongoose.Schema({
  _id: { type: String }, // 使用字符串 id，与原 generateGroupId 兼容
  name: { type: String, required: true },
  description: { type: String, default: '' },
  ownerId: { type: mongoose.Schema.Types.ObjectId, ref: 'User', required: true },
  admins: [{ type: mongoose.Schema.Types.ObjectId, ref: 'User' }],
  members: [{ type: mongoose.Schema.Types.ObjectId, ref: 'User' }],
  announcement: { type: String, default: '' },
  muteAll: { type: Boolean, default: false },
  pinnedMessages: [{ type: mongoose.Schema.Types.ObjectId, ref: 'Message' }],
  createdAt: { type: Date, default: Date.now }
});

module.exports = mongoose.model('Group', groupSchema);
EOF

          # models/Message.js
          cat > models/Message.js <<'EOF'
const mongoose = require('mongoose');

const messageSchema = new mongoose.Schema({
  groupId: { type: String, required: true, index: true },
  userId: { type: mongoose.Schema.Types.ObjectId, ref: 'User', required: true, index: true },
  username: { type: String },
  avatar: { type: String },
  content: { type: String, default: '' },
  type: { type: String, default: 'text' },
  imageUrl: { type: String, default: '' },
  replyTo: { type: mongoose.Schema.Types.ObjectId, ref: 'Message' },
  edited: { type: Boolean, default: false },
  pinned: { type: Boolean, default: false },
  createdAt: { type: Date, default: Date.now, index: true }
});

messageSchema.index({ groupId: 1, createdAt: -1 });

module.exports = mongoose.model('Message', messageSchema);
EOF

          # middleware/auth.js
          cat > middleware/auth.js <<'EOF'
const jwt = require('jsonwebtoken');
const User = require('../models/User');

const JWT_SECRET = process.env.JWT_SECRET || 'replace-this-in-production';

function generateToken(userId) {
  return jwt.sign({ userId }, JWT_SECRET, { expiresIn: '7d' });
}

async function authenticateToken(req, res, next) {
  try {
    const authHeader = req.headers['authorization'];
    const token = authHeader && authHeader.split(' ')[1];
    if (!token) return res.status(401).json({ error: '需要登录' });

    const decoded = jwt.verify(token, JWT_SECRET);
    if (!decoded) return res.status(403).json({ error: '无效的令牌' });

    req.userId = decoded.userId;
    req.user = await User.findById(req.userId).select('-password').lean();
    next();
  } catch (err) {
    return res.status(403).json({ error: '无效的令牌' });
  }
}

module.exports = { generateToken, authenticateToken };
EOF

          # middleware/isAdmin.js
          cat > middleware/isAdmin.js <<'EOF'
const User = require('../models/User');

async function isAdmin(req, res, next) {
  try {
    const uid = req.userId || (req.user && req.user._id);
    if (!uid) return res.status(401).json({ error: '需要登录' });

    const user = req.user || await User.findById(uid).select('role');
    if (user && user.role === 'admin') return next();

    return res.status(403).json({ error: '权限不足，仅限管理员访问' });
  } catch (err) {
    return res.status(500).json({ error: '服务器错误' });
  }
}

module.exports = isAdmin;
EOF

          # server.js (主要逻辑，使用 Mongoose + admin + 清理)
          cat > server.js <<'EOF'
require('dotenv').config();
const express = require('express');
const http = require('http');
const socketIo = require('socket.io');
const cors = require('cors');
const bcrypt = require('bcryptjs');
const jwt = require('jsonwebtoken');
const multer = require('multer');
const path = require('path');
const fs = require('fs');
const mongoose = require('mongoose');

const app = express();
const server = http.createServer(app);
const io = socketIo(server, {
  cors: { origin: "*", methods: ["GET","POST"] }
});

const MONGODB_URI = process.env.MONGODB_URI || 'mongodb://localhost:27017/chat-room';
const JWT_SECRET = process.env.JWT_SECRET || 'replace-this-in-production';
const PORT = process.env.PORT || 3000;
const MAX_MESSAGES = parseInt(process.env.MAX_MESSAGES || '100000', 10);

// connect to MongoDB
mongoose.connect(MONGODB_URI, { useNewUrlParser: true, useUnifiedTopology: true })
  .then(() => console.log('✅ MongoDB 已连接'))
  .catch(err => {
    console.error('❌ MongoDB 连接失败:', err);
    process.exit(1);
  });

// models & middleware
const User = require('./models/User');
const Group = require('./models/Group');
const Message = require('./models/Message');
const { generateToken, authenticateToken } = require('./middleware/auth');
const isAdmin = require('./middleware/isAdmin');

// middleware
app.use(cors());
app.use(express.json({ limit: '10mb' }));
app.use(express.urlencoded({ extended: true, limit: '10mb' }));
app.use('/uploads', express.static(path.join(__dirname, 'uploads')));
app.use(express.static(path.join(__dirname, 'public')));

// create uploads dir for local/dev usage
const uploadsDir = path.join(__dirname, 'uploads');
if (!fs.existsSync(uploadsDir)) {
  fs.mkdirSync(uploadsDir, { recursive: true });
}

// multer (development only - production should forward to external image host)
const storage = multer.diskStorage({
  destination: (req, file, cb) => cb(null, uploadsDir),
  filename: (req, file, cb) => {
    const uniqueSuffix = Date.now() + '-' + Math.round(Math.random() * 1E9);
    cb(null, uniqueSuffix + path.extname(file.originalname));
  }
});
const upload = multer({
  storage,
  limits: { fileSize: 5 * 1024 * 1024 },
  fileFilter: (req, file, cb) => {
    const allowedTypes = /jpeg|jpg|png|gif|webp/;
    const extname = allowedTypes.test(path.extname(file.originalname).toLowerCase());
    const mimetype = allowedTypes.test(file.mimetype);
    if (mimetype && extname) return cb(null, true);
    cb(new Error('只支持图片文件!'));
  }
});

// socket online map
const onlineUsers = new Map();

// helper: generate group id
function generateGroupId() {
  return Math.floor(1000000 + Math.random() * 9000000).toString();
}

// message creation + cleanup
async function createMessageAndCleanup(payload) {
  const msg = await Message.create(payload);

  const total = await Message.estimatedDocumentCount();
  if (total > MAX_MESSAGES) {
    const exceed = total - MAX_MESSAGES;
    const toDelete = await Message.find().sort({ createdAt: 1 }).limit(exceed).select('_id');
    const ids = toDelete.map(d => d._id);
    await Message.deleteMany({ _id: { $in: ids } });
    console.log(`消息清理：删除 ${ids.length} 条最旧消息`);
  }

  return msg;
}

// =========== API ===========

// register
app.post('/api/register', async (req, res) => {
  try {
    const { username, password, email } = req.body;
    if (!username || !password || !email) return res.status(400).json({ error: '请填写所有必填项' });

    const existing = await User.findOne({ $or: [{ username }, { email }] });
    if (existing) return res.status(400).json({ error: '用户名或邮箱已存在' });

    const hashed = await bcrypt.hash(password, 10);
    const avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
    let user = await User.create({ username, email, password: hashed, avatar });

    // 如果当前没有管理员，则把首个注册用户设为 admin（自动设定）
    const adminCount = await User.countDocuments({ role: 'admin' });
    if (adminCount === 0) {
      user.role = 'admin';
      await user.save();
      console.log('首位注册用户已自动设为 admin:', user.username);
    }

    const token = generateToken(user._id);
    res.json({
      token,
      user: { id: user._id, username: user.username, email: user.email, avatar: user.avatar, role: user.role }
    });
  } catch (err) {
    console.error('注册错误:', err);
    res.status(500).json({ error: '注册失败' });
  }
});

// login
app.post('/api/login', async (req, res) => {
  try {
    const { username, password } = req.body;
    const user = await User.findOne({ username });
    if (!user) return res.status(401).json({ error: '用户名或密码错误' });

    const ok = await bcrypt.compare(password, user.password);
    if (!ok) return res.status(401).json({ error: '用户名或密码错误' });

    const token = generateToken(user._id);
    res.json({
      token,
      user: { id: user._id, username: user.username, email: user.email, avatar: user.avatar, role: user.role }
    });
  } catch (err) {
    console.error('登录错误:', err);
    res.status(500).json({ error: '登录失败' });
  }
});

// get current user
app.get('/api/user/me', authenticateToken, async (req, res) => {
  const user = req.user;
  if (!user) return res.status(404).json({ error: '用户不存在' });
  res.json(user);
});

// create group
app.post('/api/groups', authenticateToken, async (req, res) => {
  try {
    const { name, description } = req.body;
    if (!name) return res.status(400).json({ error: '群组名称不能为空' });

    const gid = generateGroupId();
    const group = await Group.create({
      _id: gid,
      name,
      description: description || '',
      ownerId: req.userId,
      admins: [],
      members: [req.userId]
    });

    // 更新用户 groups（字符串 id）
    await User.findByIdAndUpdate(req.userId, { $push: { groups: gid } });

    res.json(group);
  } catch (err) {
    console.error('创建群组错误:', err);
    res.status(500).json({ error: '创建群组失败' });
  }
});

// other REST endpoints omitted for brevity — you can port over existing endpoints similarly.
// Example: upload (development only)
app.post('/api/upload', authenticateToken, upload.single('image'), (req, res) => {
  if (!req.file) return res.status(400).json({ error: '没有文件上传' });

  // 注意：生产应将文件转发到图床（Cloudinary / ImgBB），并把返回的 URL 存入 Message.imageUrl
  const imageUrl = `/uploads/${req.file.filename}`;
  res.json({ url: imageUrl });
});

// =========== Socket.IO ===========
io.on('connection', (socket) => {
  console.log('用户连接:', socket.id);

  socket.on('authenticate', async (token) => {
    try {
      const decoded = jwt.verify(token, JWT_SECRET);
      if (!decoded) return;
      socket.userId = decoded.userId;
      onlineUsers.set(decoded.userId.toString(), socket.id);

      const user = await User.findById(decoded.userId);
      if (user) {
        // 加入用户所有群组房间
        for (const gid of user.groups || []) {
          socket.join(gid);
        }

        // 通知群组其他成员该用户上线
        for (const gid of user.groups || []) {
          io.to(gid).emit('user_online', { userId: user._id.toString(), username: user.username });
        }
      }
    } catch (err) {
      // ignore
    }
  });

  socket.on('send_message', async (data) => {
    if (!socket.userId) return;
    const { groupId, content, type, replyTo, imageUrl } = data;
    const group = await Group.findById(groupId);
    if (!group || !group.members.some(m => m.toString() === socket.userId.toString())) return;

    if (group.muteAll && group.ownerId.toString() !== socket.userId.toString() && !group.admins.map(a => a.toString()).includes(socket.userId.toString())) {
      socket.emit('error', { message: '当前群组已开启全员禁言' });
      return;
    }

    const user = await User.findById(socket.userId);

    const messagePayload = {
      groupId,
      userId: socket.userId,
      username: user ? user.username : '未知用户',
      avatar: user ? user.avatar : '',
      content,
      type: type || 'text',
      imageUrl,
      replyTo
    };

    const message = await createMessageAndCleanup(messagePayload);

    io.to(groupId).emit('new_message', message);
  });

  socket.on('disconnect', () => {
    console.log('用户断开:', socket.id);
    if (socket.userId) {
      onlineUsers.delete(socket.userId.toString());
    }
  });
});

// Admin routes
app.get('/api/admin/users', authenticateToken, isAdmin, async (req, res) => {
  const users = await User.find().select('-password').lean();
  res.json(users);
});

app.delete('/api/admin/users/:id', authenticateToken, isAdmin, async (req, res) => {
  const uid = req.params.id;
  await User.findByIdAndDelete(uid);
  await Message.deleteMany({ userId: uid });
  await Group.updateMany({}, { $pull: { members: mongoose.Types.ObjectId(uid), admins: mongoose.Types.ObjectId(uid) } });
  res.json({ message: '用户已删除' });
});

app.get('/api/admin/stats', authenticateToken, isAdmin, async (req, res) => {
  const usersCount = await User.countDocuments();
  const groupsCount = await Group.countDocuments();
  const messagesCount = await Message.countDocuments();
  res.json({ usersCount, groupsCount, messagesCount, onlineCount: onlineUsers.size });
});

app.post('/api/admin/messages/cleanup', authenticateToken, isAdmin, async (req, res) => {
  const total = await Message.countDocuments();
  if (total <= MAX_MESSAGES) return res.json({ message: '无需清理', total });
  const exceed = total - MAX_MESSAGES;
  const toDelete = await Message.find().sort({ createdAt: 1 }).limit(exceed).select('_id');
  const ids = toDelete.map(d => d._id);
  await Message.deleteMany({ _id: { $in: ids } });
  res.json({ message: `已删除 ${ids.length} 条消息`, totalAfter: await Message.countDocuments() });
});

// start server
server.listen(PORT, () => {
  console.log(`服务器运行在 http://localhost:${PORT}`);
});
EOF

          # .env.example
          cat > .env.example <<'EOF'
# Copy to .env and fill values for local development or for deployment
MONGODB_URI=mongodb+srv://<user>:<password>@cluster0.xxxx.mongodb.net/chatroom?retryWrites=true&w=majority
JWT_SECRET=replace_with_a_strong_random_secret
PORT=3000
# MAX_MESSAGES default 100000
# MAX_MESSAGES=100000
EOF

          # README.PR_NOTES.md
          cat > README.PR_NOTES.md <<'EOF'
This PR integrates MongoDB (Mongoose), adds admin system, and implements message retention.

After merging:
1. Set environment variables: MONGODB_URI, JWT_SECRET (and optionally PORT, MAX_MESSAGES).
2. Run `npm install`.
3. Start with `npm start` or `npm run dev` for development.
4. For first registered user: If there is no admin in the DB, the first registered account will be set as admin automatically.

NOTE: For production, use an external image host and update the upload handler to forward uploads to the host and store returned URLs only.
EOF

          # configure git and commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json models middleware server.js .env.example README.PR_NOTES.md || true
          git commit -m "Integrate MongoDB (Mongoose), add admin system, and implement message retention" || echo "No changes to commit"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Integrate MongoDB (Mongoose), add admin system, and implement message retention"
          branch: integrate/mongo-admin
          title: "Integrate MongoDB (Mongoose), add admin system, and implement message retention"
          body: |
            This PR integrates MongoDB (Mongoose), adds an admin role and admin APIs, and implements message retention cleanup (default max 100,000 messages).

            Actions included:
            - Add mongoose + dotenv deps
            - Add models: User, Group, Message
            - Add middleware: auth, isAdmin
            - Replace server.js with Mongoose-based implementation (register/login, socket auth, admin routes)
            - Implement automatic cleanup of old messages beyond MAX_MESSAGES (default 100000)
            - Auto-assign the first registered user as admin if none exists
            - Add .env.example and README.PR_NOTES.md

            IMPORTANT: Do NOT put your MONGODB_URI or JWT_SECRET into repo. Set them in your environment / deployment platform.
          labels: migration, backend
